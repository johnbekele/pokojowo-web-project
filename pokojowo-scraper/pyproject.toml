[project]
name = "pokojowo-scraper"
version = "2.0.0"
description = "Local-first scraper for Polish rental listings (OLX, Otodom) feeding the Pokojowo platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pokojowo Team" }]

dependencies = [
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "typer>=0.9.0",
    "httpx>=0.26.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.0",
    "pygeohash>=1.2.0",
    "lingua-language-detector>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
# Fast CPU-only translation fallback (opus-mt via CTranslate2)
ct2 = [
    "ctranslate2>=4.0.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
]

[project.scripts]
pokojowo-scraper = "pokojowo_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokojowo_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
