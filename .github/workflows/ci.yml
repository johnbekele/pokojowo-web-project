name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pokojowo-fastapi/requirements*.txt
      - name: Install libmagic
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmagic1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DEBUG: "True"  # dev-mode SECRET_KEY fallback; tests need no real secret
        run: pytest -q
      - name: Import smoke test
        env:
          DEBUG: "True"
          MONGODB_URL: mongodb://localhost:27017
        run: python -c "import main"

  chat-tests:
    name: Chat tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pokojowo-chat/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DEBUG: "True"  # dev-mode SECRET_KEY fallback; tests need no real secret
        run: pytest -q
      - name: Import smoke test
        env:
          DEBUG: "True"
          MONGODB_URL: mongodb://localhost:27017
        run: python -c "import main"

  web-build:
    name: Web build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pokojowo-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  frontend-lint:
    name: Web lint (baseline ratchet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pokojowo-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint . --format json > lint-report.json || true
      - name: Enforce lint baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("lint-report.json").read_text())
          errors = sum(item["errorCount"] for item in report)
          warnings = sum(item["warningCount"] for item in report)
          baseline = json.loads(Path("../.github/ci/quality-baseline.json").read_text())["frontend_eslint"]
          print(f"ESLint: {errors} errors, {warnings} warnings (baseline: {baseline})")
          if errors > baseline["errors"] or warnings > baseline["warnings"]:
              raise SystemExit("ESLint regression: update code or intentionally ratchet the baseline")
          PY

  mobile-lint:
    name: Mobile lint (baseline ratchet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pokojowo-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint . --format json > lint-report.json || true
      - name: Enforce lint baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("lint-report.json").read_text())
          errors = sum(item["errorCount"] for item in report)
          warnings = sum(item["warningCount"] for item in report)
          baseline = json.loads(Path("../.github/ci/quality-baseline.json").read_text())["mobile_eslint"]
          print(f"ESLint: {errors} errors, {warnings} warnings (baseline: {baseline})")
          if errors > baseline["errors"] or warnings > baseline["warnings"]:
              raise SystemExit("ESLint regression: update code or intentionally ratchet the baseline")
          PY

  backend-ruff:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pokojowo-fastapi/requirements*.txt
      - name: Install ruff
        run: pip install ruff==0.16.0
      - name: Run ruff
        run: ruff check app tests --select E4,E7,E9,F --output-format json > ruff-report.json || true
      - name: Enforce ruff baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          issues = json.loads(Path("ruff-report.json").read_text())
          baseline = json.loads(Path("../.github/ci/quality-baseline.json").read_text())["fastapi_ruff"]["errors"]
          print(f"ruff: {len(issues)} errors (baseline: {baseline})")
          if len(issues) > baseline:
              raise SystemExit("ruff regression: update code or intentionally ratchet the baseline")
          PY

  chat-ruff:
    name: Chat lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pokojowo-chat/requirements*.txt
      - name: Install ruff
        run: pip install ruff==0.16.0
      - name: Run ruff
        run: ruff check app tests --select E4,E7,E9,F --output-format json > ruff-report.json || true
      - name: Enforce ruff baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          issues = json.loads(Path("ruff-report.json").read_text())
          baseline = json.loads(Path("../.github/ci/quality-baseline.json").read_text())["chat_ruff"]["errors"]
          print(f"ruff: {len(issues)} errors (baseline: {baseline})")
          if len(issues) > baseline:
              raise SystemExit("ruff regression: update code or intentionally ratchet the baseline")
          PY

  scraper-admin-build:
    name: Scraper dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-scraper/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pokojowo-scraper/admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    # Public repositories without the dependency graph enabled receive a
    # hard failure from dependency-review-action. Keep the check visible while
    # allowing the rest of CI to run until the repository setting is enabled.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  container-scan:
    name: Container scan (critical)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag pokojowo-backend:ci --file pokojowo-fastapi/Dockerfile pokojowo-fastapi
      - name: Build chat image
        run: docker build --tag pokojowo-chat:ci --file pokojowo-chat/Dockerfile pokojowo-chat
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pokojowo-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan chat image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pokojowo-chat:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  scraper-tests:
    name: Scraper tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run scraper tests
        run: uv run pytest -q

  mobile-typecheck:
    name: Mobile typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokojowo-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pokojowo-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (3 pre-existing errors are the accepted baseline)
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc.log
          COUNT=$(grep -cE "error TS" tsc.log || true)
          echo "tsc errors: $COUNT (baseline: 3)"
          if [ "$COUNT" -gt 3 ]; then
            echo "::error::tsc error count ($COUNT) exceeds the accepted baseline of 3"
            exit 1
          fi
