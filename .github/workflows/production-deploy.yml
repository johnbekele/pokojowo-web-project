name: Production deploy

on:
  # Deploy only the commit that has passed the required main-branch CI run.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Maintainers can redeploy or recover without a laptop. Manual runs are
  # deliberately limited to the main branch so secrets never reach a PR ref.
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag (defaults to the selected commit SHA)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and verify production
    # workflow_run is trusted only for a successful run whose source is this
    # repository's main branch. workflow_dispatch is similarly main-only.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        # These credentials are stored as repository secrets and masked by
        # Actions. The deploy script never prints their values.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and deploy backend and chat
        id: deploy
        env:
          AWS_REGION: us-east-1
          RESOLVE_TARGET_FROM_AWS: '1'
          # The deployed Compose file always references this immutable tag;
          # latest is intentionally not moved by CI.
          PUSH_LATEST: '0'
          DEPLOY_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          TARGET_OUTPUT_FILE: ${{ runner.temp }}/deploy-target.env
        run: |
          set -euo pipefail
          tag="${DEPLOY_TAG:-${SOURCE_SHA}}"
          TAG="${tag}" bash pokojowo-pulumi-infra/scripts/build-and-push.sh
          # The script writes only non-secret resource/image coordinates here.
          cat "${TARGET_OUTPUT_FILE}" >> "${GITHUB_ENV}"

      - name: Verify backend through CloudFront
        run: |
          set -euo pipefail
          HEALTH_URL="${CLOUDFRONT_URL}/health"
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --max-time 15 "${HEALTH_URL}")" \
              && printf '%s' "${response}" | jq -e '.status == "healthy"' >/dev/null; then
              printf 'Production backend is healthy at %s\n' "${HEALTH_URL}"
              printf '%s\n' "${response}"
              exit 0
            fi
            printf 'Health check attempt %s/30 failed; retrying...\n' "${attempt}" >&2
            sleep 10
          done
          printf 'Production health check failed: %s\n' "${HEALTH_URL}" >&2
          exit 1
