# Production docker-compose deployed onto the EC2 host at /opt/pokojowo.
# Values interpolated from ${...} come from /opt/pokojowo/.env on the host,
# which the deploy script uploads alongside this file.

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: pokojowo-backend
    restart: unless-stopped
    ports:
      # Bind FastAPI (uvicorn/gunicorn listens on ${PORT:-10000} inside)
      # to host port 80 so the CloudFront origin can reach it.
      - "80:10000"
    environment:
      - PORT=10000
      - DEBUG=False
      - CHAT_SERVICE_URL=http://chat:10002
      # Both images default to 2 workers, which cannot work while Socket.IO
      # state (connected_users, rooms) lives in process memory: notifications
      # only reach clients that happen to share a worker, and polling clients
      # get "session ID unknown" when a request lands on the other one.
      # Raise this only once #144 puts a Redis adapter behind the sockets.
      - GUNICORN_WORKERS=1
    env_file:
      # AWS_REGION and S3_UPLOADS_BUCKET must be present in backend.env.
      # AWS credentials come from the EC2 instance profile via IMDSv2 —
      # never bake keys into the image or env.
      - ./backend.env
    # Uploads now go to S3; no local volume required.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chat:
    image: ${CHAT_IMAGE}
    container_name: pokojowo-chat
    restart: unless-stopped
    ports:
      # Chat service on host port 81 for CloudFront chat origin.
      - "81:10002"
    environment:
      - PORT=10002
      - DEBUG=False
      - DATABASE_NAME=pokojowo_chat
      - MAIN_API_URL=http://backend:10000
      # Single worker until #144; see the note on the backend service.
      - GUNICORN_WORKERS=1
    env_file:
      - ./chat.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
